[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-sim"
version = "0.1.0"
description = "F1 race strategy and pit-window risk simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "fastf1>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.35", "plotly>=5.20"]

[project.scripts]
strategy-sim = "strategy_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
